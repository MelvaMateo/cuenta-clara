# Análisis automático de SonarCloud (https://sonarcloud.io).
#
# Se analiza el código de la app: el JavaScript del sitio, el healthcheck, el
# service worker, los estilos y las páginas.
sonar.sources=.

# Quedan afuera:
#   sql/                 SonarCloud analiza los .sql como PL/SQL de Oracle, no
#                        como PostgreSQL, y marcaría errores que no existen.
#                        Esos scripts se prueban en tests/sql.test.mjs.
#   tests/, scripts/     pruebas y herramientas, no código de la app.
#   coverage/, docs/,    reportes, documentación, imágenes y dependencias.
#   img/, node_modules/
sonar.exclusions=sql/**,tests/**,scripts/**,coverage/**,docs/**,img/**,node_modules/**

sonar.sourceEncoding=UTF-8
