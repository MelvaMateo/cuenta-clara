<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b5179e">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Iniciar sesión — Cuenta Clara</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="marca">
    <img src="icon.svg" alt="">
    Cuenta Clara
  </div>

  <main class="caja">
    <h1>Iniciar sesión</h1>
    <p class="sub">Entrá con tu cuenta de Google para ver tu inventario y tus fiados.</p>

    <div id="aviso" class="aviso" role="alert"></div>

    <button id="btnGoogle" class="btn-google" type="button">
      <svg class="logo-google" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continuar con Google
    </button>

    <p class="nota">Cuenta Clara solo recibe tu nombre y tu correo. Nunca ve tu contraseña de Google.</p>
  </main>

  <p class="volver"><a href="index.html">&larr; Volver al inicio</a></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
